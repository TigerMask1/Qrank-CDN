name: Automated Book Queue Pipeline (AIRstudy)

# Automatically monitors incoming_books/ for newly uploaded NEET/JEE textbooks.
# Extracts, classifies, and uploads questions into Backblaze B2 & Turso DB.
# Supports parallel runs via atomic chunk claims:
#   - Runner 1 claims Pages 0-150.
#   - Runner 2 (triggered concurrently) immediately claims Pages 151-300.
# Strictly conserves Turso DB read quota (1-2 rows read per 45-minute chunk).

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'QRank branch to run code from'
        required: false
        default: 'feature/air-study-qmatch-upgrade'
  schedule:
    # 2-hour pulse in case runner was interrupted or network dropped
    - cron: '0 */2 * * *'
  push:
    paths:
      - 'incoming_books/**'

# Scoped per run_id so multiple runs can execute concurrently in parallel without cancelling each other
concurrency:
  group: auto_book_queue_${{ github.run_id }}
  cancel-in-progress: false

jobs:
  process_queue:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Private QRank Repo
        uses: actions/checkout@v4
        with:
          repository: TigerMask1/Qrank
          ref: ${{ github.event.inputs.branch || 'feature/air-study-qmatch-upgrade' }}
          token: ${{ secrets.PRIVATE_REPO_PAT || secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Checkout QRank-CDN Engine Scripts
        uses: actions/checkout@v4
        with:
          path: cdn_engine

      - name: Sync Robust Parallel Engine Scripts
        run: |
          mkdir -p scripts
          cp -f cdn_engine/scripts/auto_book_queue.py scripts/auto_book_queue.py
          cp -f cdn_engine/scripts/batch_pdf_worker.py scripts/batch_pdf_worker.py

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ingestion Dependencies
        run: |
          pip install --quiet PyMuPDF Pillow google-genai boto3 requests pypdf python-dotenv

      - name: Execute Autonomous Queue Cycle
        env:
          GEMINI_MODEL: 'gemini-3.5-flash-lite'
          GEMINI_FALLBACK_MODEL: 'gemini-3.1-flash-lite'
          GEMMA_FALLBACK_MODEL: 'gemma-4-31b-it'
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION || 'eu-central-003' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PRIVATE_REPO_PAT || secrets.GITHUB_TOKEN }}
          PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_CDN_REPO: 'TigerMask1/Qrank-CDN'
          GITHUB_BRANCH: ${{ github.event.inputs.branch || 'feature/air-study-qmatch-upgrade' }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CALLBACK_URL: ${{ secrets.QRANK_CALLBACK_URL }}
        run: |
          python3 scripts/auto_book_queue.py
